name: Developer Build

on:
  workflow_dispatch:
    inputs:
      target_service:
        description: 'Tên service cần test'
        required: true
        default: 'tax'
        type: string
      target_branch:
        description: 'Tên branch chứa code mới của service đó'
        required: true
        default: 'dev_tax_service'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Helm
        run: |
          helm repo add stakater https://stakater.github.io/stakater-charts
          helm repo update
      - name: Deploy services
        run: |
          TARGET_SERVICE="${{ inputs.target_service }}"
          TARGET_BRANCH="${{ inputs.target_branch }}"
          
          SERVICES="cart customer inventory location media order payment payment-paypal product promotion rating search tax recommendation webhook sampledata"
          
          for service in $SERVICES; do
            tag="latest"
            branch="main"
            
            if [ "$service" == "$TARGET_SERVICE" ] && [ -n "$TARGET_BRANCH" ]; then
              branch=$TARGET_BRANCH
              tag=$(git ls-remote origin refs/heads/$branch | awk '{print $1}' | cut -c1-7)
              if [ -z "$tag" ]; then
                tag=$branch
              fi
            fi
            
            helm dependency build ./k8s/charts/$service || true
            helm upgrade --install $service ./k8s/charts/$service \
              --namespace yas-test --create-namespace \
              --set backend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/yas-$service \
              --set backend.image.tag=$tag \
              --set backend.service.type=NodePort \
              --set backend.ingress.enabled=false \
              --wait --timeout 2m || true
          done