name: Developer Build

on:
  workflow_dispatch:
    inputs:
      target_service:
        description: 'Tên service cần test'
        required: true
        default: 'tax'
        type: string
      target_branch:
        description: 'Tên branch chứa code mới của service đó'
        required: true
        default: 'dev_tax_service'
        type: string

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Helm
        run: |
          helm repo add stakater https://stakater.github.io/stakater-charts
          helm repo update
      - name: Deploy services
        run: |
          TARGET_SERVICE="${{ inputs.target_service }}"
          TARGET_BRANCH="${{ inputs.target_branch }}"
          
          SERVICES="cart customer inventory location media order payment payment-paypal product promotion rating search tax recommendation webhook sampledata"
          
          for service in $SERVICES; do
            tag="latest"
            branch="main"
            
            if [ "$service" == "$TARGET_SERVICE" ] && [ -n "$TARGET_BRANCH" ]; then
              branch=$TARGET_BRANCH
              tag=$(git ls-remote origin refs/heads/$branch | awk '{print $1}' | cut -c1-7)
              if [ -z "$tag" ]; then
                tag=$branch
              fi
            fi
            
            helm dependency build ./k8s/charts/$service || true
            helm upgrade --install $service ./k8s/charts/$service \
              --namespace yas-test --create-namespace \
              --set backend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/yas-$service \
              --set backend.image.tag=$tag \
              --set backend.service.type=NodePort \
              --set backend.ingress.enabled=false \
              --wait --timeout 2m || true
          done
          
          # Khởi tạo lệnh tự động lấy IP và Port thực tế cho Dev
          echo "====================================================================="
          echo "🎉 DEPLOYMENT HOÀN TẤT CHO MÔI TRƯỜNG TEST! 🎉"
          echo "====================================================================="
          
          # Lấy IP của Kubernetes Worker node đang chạy (k3s)
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          
          # Nếu có deploy specific service thì trích xuất NodePort của nó
          if [ -n "$TARGET_SERVICE" -a "$TARGET_SERVICE" != " " ]; then
            # Đợi một chút để K8s load port
            sleep 3
            NODE_PORT=$(kubectl get svc $TARGET_SERVICE-backend -n yas-test -o jsonpath='{.spec.ports[0].nodePort}' || echo "N/A")
            
            echo "🔥 THÔNG TIN TRUY CẬP CHO SERVICE: $TARGET_SERVICE"
            echo "1. Thêm dòng này vào cuối file hosts trên máy của bạn:"
            echo "   (Linux/Mac: /etc/hosts | Windows: C:\Windows\System32\drivers\etc\hosts)"
            echo "   ---------------------------------------"
            echo "   $NODE_IP api.yas.local"
            echo "   ---------------------------------------"
            echo "2. Mở trình duyệt web hoặc Postman gọi vào link:"
            echo "   http://api.yas.local:$NODE_PORT"
            
          else
            echo "1. Thêm IP Worker Node vào file hosts:"
            echo "   $NODE_IP api.yas.local"
            echo "2. Để xem các Port của toàn bộ Service gọi lệnh sau trên cụm K8s:"
            echo "   kubectl get svc -n yas-test"
          fi
          echo "====================================================================="