name: Test CD

on:
  workflow_dispatch:
    inputs:
      target_service:
        description: 'Tên service developer đang sửa code (vd: tax)'
        required: true
        default: 'product'
        type: choice
        options:
          - product
      target_branch:
        description: 'Nhánh code muốn test (vd: dev_tax_service hoặc main)'
        required: true
        default: 'dev_tax_service'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lấy mã Commit ID của nhánh
        run: |
          TARGET_SERVICE="${{ inputs.target_service }}"
          TARGET_BRANCH="${{ inputs.target_branch }}"
          
          # Cắt danh sách xuống chỉ còn 3 service làm nòng cốt để test Istio theo đúng đề bài
          # 1. tax: service bị thử nghiệm policy mTLS và VirtualService Retry
          # 2. product: service duy nhất được phép gọi vào tax (theo Istio AuthorizationPolicy)
          # 4. yas-configuration: Chứa config map lõi bắt buộc để các app spring boot khởi động được!
          SERVICES="yas-configuration tax product backoffice storefront"
          
          for service in $SERVICES; do
            tag="latest"
            
            # Xử lý ngoại lệ tên thư mục và tham số cấu hình cho Frontend (UI)
            CHART_DIR="$service"
            IMAGE_PREFIX="backend"
            
            if [ "$service" == "backoffice" ] || [ "$service" == "storefront" ]; then
              CHART_DIR="$service-ui"
              IMAGE_PREFIX="ui"
            fi
            
            echo "Deploying $service (Chart: $CHART_DIR)..."
            helm dependency build ./k8s/charts/$CHART_DIR || true
            helm upgrade --install $service ./k8s/charts/$CHART_DIR \
              --namespace yas-test --create-namespace \
              --set $IMAGE_PREFIX.image.repository=${{ secrets.DOCKER_USERNAME }}/yas-$service \
              --set $IMAGE_PREFIX.image.tag=$tag \
              --set $IMAGE_PREFIX.service.type=NodePort \
              --set $IMAGE_PREFIX.ingress.enabled=false \
              || true
          done
          
          # Trích xuất IP và Port cho Dev
          echo "====================================================================="
          echo "🎉 DEPLOYMENT HOÀN TẤT! 🎉"
          echo "====================================================================="
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' | awk '{print $1}')
          
          echo "📌 Thêm dòng sau vào file hosts (nếu chưa có):"
          echo "   $NODE_IP api.yas.local"
          echo ""
          echo "🌐 DANH SÁCH LINK TRUY CẬP:"
          
          # Backoffice UI (service name: backoffice-ui, port: 3000)
          BO_PORT=$(kubectl get svc backoffice-ui -n yas-test -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "N/A")
          echo "   [Backoffice] http://api.yas.local:$BO_PORT"
          
          # Storefront UI (service name: storefront-ui, port: 3000)
          SF_PORT=$(kubectl get svc storefront-ui -n yas-test -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "N/A")
          echo "   [Storefront] http://api.yas.local:$SF_PORT"
          
          # Tax Swagger (để test Istio)
          TAX_PORT=$(kubectl get svc tax -n yas-test -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "N/A")
          echo "   [Tax API]    http://api.yas.local:$TAX_PORT/tax/swagger-ui.html"
          
          # Kiali (service mesh dashboard)
          KIALI_PORT=$(kubectl get svc kiali -n istio-system -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "N/A")
          if [ "$KIALI_PORT" == "N/A" ]; then
            echo "   [Kiali]      Chưa expose NodePort. Chạy: kubectl patch svc kiali -n istio-system -p '{\"spec\":{\"type\":\"NodePort\"}}'"
          else
            echo "   [Kiali]      http://$NODE_IP:$KIALI_PORT/kiali"
          fi
          echo "====================================================================="
