name: Build Test

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [cart, customer, inventory, location, media, order, payment, payment-paypal, product, promotion, rating, search, tax, recommendation, webhook, sampledata]
      fail-fast: false
    steps:
      - name: Kiểm tra Repo
        uses: actions/checkout@v4

      - name: Đăng nhập vào DockerHub cá nhân
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cài đặt JDK 25 (Bắt buộc cho YAS)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Biên dịch cục bộ (Bỏ qua unit test & checkstyle)
        run: mvn clean package -pl ${{ matrix.service }} -am -DskipTests -Dcheckstyle.skip=true

      - name: Build & Push lên DockerHub
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/yas-${{ matrix.service }}:latest
