name: CI Tag 

on:
  push:
    branches:
      - '**'

jobs:
  Build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [cart,customer,inventory,location,media,order,payment,payment-paypal,product,promotion,rating,search,tax,recommendation,webhook,sampledata]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get short commit SHA
        id: vars
        run: echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ env.COMMIT_ID }}